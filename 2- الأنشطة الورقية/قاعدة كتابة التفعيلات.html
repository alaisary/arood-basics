<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قاعدة كتابة التفعيلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }
  :root {
    --ink: #1f2a37;
    --muted: #5b6573;
    --brand: #1d4e5f;
    --yes: #1f7a5a;
    --yes-bg: #eaf5f0;
    --no: #a33a3a;
    --no-bg: #fbeeee;
    --line: #d5dbe1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; color: var(--ink); }
  body {
    font-family: "Noto Naskh Arabic", "Sakkal Majalla", "Traditional Arabic", serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page {
    width: 210mm; height: 297mm;
    padding: 9mm 10mm;
    display: grid;
    grid-template-rows: repeat(4, 1fr);
    row-gap: 7mm;
    position: relative;
  }
  /* dashed cut guides between copies */
  .cut {
    position: absolute; left: 4mm; right: 4mm; height: 0;
    border-top: 0.3mm dashed #b8c0c8;
  }
  .cut span {
    position: absolute; left: 0; top: -2.3mm;
    background: #fff; padding: 0 1.5mm;
    font-size: 8pt; color: #9aa4ae; line-height: 1;
  }
  .card {
    border: 0.35mm solid var(--brand);
    border-radius: 2.5mm;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .card header {
    background: var(--brand);
    color: #fff;
    font-family: "Cairo", sans-serif;
    font-weight: 700;
    font-size: 12pt;
    text-align: center;
    padding: 1.4mm 4mm 1.8mm;
    letter-spacing: 0.1px;
  }
  .cols { display: grid; grid-template-columns: 1fr 1fr; }
  .col { padding: 2.2mm 3.5mm 2mm; }
  .col + .col { border-right: 0.3mm solid var(--line); }
  .col h3 {
    font-family: "Cairo", sans-serif;
    font-size: 10pt; font-weight: 700;
    display: flex; align-items: center; gap: 1.6mm;
    padding: 0.6mm 2.4mm 1mm;
    border-radius: 1.6mm;
    margin-bottom: 1.6mm;
    width: fit-content;
  }
  .col.yes h3 { background: var(--yes-bg); color: var(--yes); }
  .col.no  h3 { background: var(--no-bg);  color: var(--no); }
  .mark {
    width: 4.2mm; height: 4.2mm; border-radius: 50%;
    display: inline-grid; place-items: center;
    color: #fff; font-size: 7pt; line-height: 1;
  }
  .yes .mark { background: var(--yes); }
  .no  .mark { background: var(--no); }
  ol { list-style: none; counter-reset: n; }
  li {
    counter-increment: n;
    position: relative;
    padding-right: 5.6mm;
    font-size: 10.6pt;
    line-height: 1.64;
    margin-bottom: 0.5mm;
  }
  li::before {
    content: counter(n, arabic-indic);
    position: absolute; right: 0; top: 0.9mm;
    width: 4.2mm; height: 4.2mm; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 7.5pt; font-weight: 700; line-height: 1;
  }
  .yes li::before { background: var(--yes-bg); color: var(--yes); }
  .no  li::before { background: var(--no-bg);  color: var(--no); }
  .ex { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <template id="card">
    <section class="card">
      <header>قبل كتابة التفعيلات تذكّري القاعدة</header>
      <div class="cols">
        <div class="col yes">
          <h3><span class="mark">✓</span>ما يُنطق يُكتب</h3>
          <ol>
            <li>التنوين – يُحسب نونًا <span class="ex">(غَفورٌ)</span></li>
            <li>الألف في أسماء الإشارة <span class="ex">(هذه – هذا – هؤلاء – ذلك – أولئك)</span></li>
            <li>الألف في <span class="ex">(الله – الرحمن – إله – لكن – طه)</span></li>
            <li>الحرف المشدد = حرف ساكن + متحرك</li>
            <li>الهمزة الممدودة (آ) = همزة مفتوحة (أ) + ألف مد ساكنة</li>
            <li>إشباع حركة الروي <span class="ex">(الحرف الأخير من الشطر)</span></li>
          </ol>
        </div>
        <div class="col no">
          <h3><span class="mark">✕</span>ما لا يُنطق لا يُكتب</h3>
          <ol>
            <li>همزة الوصل إذا وقعت في وسط الكلام <span class="ex">(والكتاب – فاستمع)</span></li>
            <li>الألف الفارقة بعد واو الجماعة <span class="ex">(كَتَبُوا)</span></li>
            <li>اللام الشمسية <span class="ex">(الـثيابُ)</span></li>
            <li>واو <span class="ex">(عمرو)</span></li>
            <li>حروف المد في آخر الكلمة إذا جاء بعدها ساكن <span class="ex">(أتى القاضي)</span></li>
          </ol>
        </div>
      </div>
    </section>
  </template>
</div>
<script>
  const page = document.querySelector('.page');
  const tpl = document.getElementById('card');
  for (let i = 0; i < 4; i++) page.appendChild(tpl.content.cloneNode(true));
  // cut guides centred in the gaps between cards
  requestAnimationFrame(() => {
    const cards = page.querySelectorAll('.card');
    const top = page.getBoundingClientRect().top;
    for (let i = 0; i < cards.length - 1; i++) {
      const a = cards[i].getBoundingClientRect().bottom;
      const b = cards[i + 1].getBoundingClientRect().top;
      const cut = document.createElement('div');
      cut.className = 'cut';
      cut.style.top = ((a + b) / 2 - top) + 'px';
      cut.innerHTML = '<span>✂</span>';
      page.appendChild(cut);
    }
  });
</script>
</body>
</html>
